services:
  searxng:
    image: searxng/searxng:latest
    container_name: leadfinder-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
